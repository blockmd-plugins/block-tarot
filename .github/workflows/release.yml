name: Daily Release

on:
  schedule:
    # 每天 00:00 UTC（北京时间 08:00）自动检查；有新的打包内容且当日未发版时自动递增版本号发版（08:15 由 store-index 自动采集）。
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force publish a new patch release even without new package changes"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: plugin-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release-notes
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Plan version and package plugin
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          FORCE: ${{ inputs.force == true && 'true' || 'false' }}
        run: |
          node --input-type=module <<'EOF'
          import assert from "node:assert/strict";
          import { execFileSync, spawn } from "node:child_process";
          import fs from "node:fs";
          import os from "node:os";
          import path from "node:path";
          import { pathToFileURL } from "node:url";

          const CHINESE_RE = /[\u3000-\u303f\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\ufe10-\ufe1f\ufe30-\ufe4f\uff00-\uffef\u{20000}-\u{2ffff}\u{30000}-\u{323af}]/u;
          const HAN_RE = /[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\u{20000}-\u{2ffff}\u{30000}-\u{323af}]/u;
          const EMOJI_RE = /[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE00}-\u{FE0F}\u{1F000}-\u{1F2FF}\u{E0020}-\u{E007F}\u200D\u20E3\u203C\u2049\u24C2\u231A\u231B\u2328\u23CF\u23E9-\u23F3\u23F8-\u23FA\u2B05-\u2B07\u2B1B\u2B1C\u2B50\u2B55\u3030\u303D\u3297\u3299]/u;
          const HTTP_URL_RE = /https?:\/\//i;
          const MAX_README_BYTES = 512 * 1024;

          function requireCond(cond, message) {
            if (!cond) {
              throw new Error(message);
            }
          }

          function sh(cmd, args = [], opts = {}) {
            return execFileSync(cmd, args, { encoding: "utf8", ...opts }).trim();
          }

          function summary(msg) {
            console.log(msg);
            const sPath = process.env.GITHUB_STEP_SUMMARY;
            if (sPath) {
              fs.appendFileSync(sPath, `${msg}\n`, "utf8");
            }
          }

          function setOutput(entries) {
            const oPath = process.env.GITHUB_OUTPUT;
            if (oPath) {
              const lines = Object.entries(entries).map(([k, v]) => `${k}=${v}`).join("\n");
              fs.appendFileSync(oPath, `${lines}\n`, "utf8");
            }
          }

          function checkText(value, locale, context) {
            if (typeof value === "string") {
              requireCond(!EMOJI_RE.test(value), `${context}: emoji in ${JSON.stringify(value)}`);
              if (locale.toLowerCase().startsWith("en")) {
                requireCond(!CHINESE_RE.test(value), `${context}: Chinese text in ${JSON.stringify(value)}`);
              }
            } else if (Array.isArray(value)) {
              value.forEach((child, index) => checkText(child, locale, `${context}[${index}]`));
            } else if (value && typeof value === "object") {
              for (const [key, child] of Object.entries(value)) {
                checkText(key, "zh", `${context}.<key>`);
                checkText(child, locale, `${context}.${key}`);
              }
            }
          }

          function checkContributesEn(value, context = "manifest.contributes") {
            if (Array.isArray(value)) {
              value.forEach((child, index) => checkContributesEn(child, `${context}[${index}]`));
            } else if (value && typeof value === "object") {
              for (const [key, child] of Object.entries(value)) {
                if (key === "en") {
                  checkText(child, "en", `${context}.en`);
                } else {
                  checkContributesEn(child, `${context}.${key}`);
                }
              }
            }
          }

          function walkFiles(dirPath) {
            const out = [];
            const stack = [dirPath];
            while (stack.length > 0) {
              const cur = stack.pop();
              const entries = fs.readdirSync(cur, { withFileTypes: true });
              for (const ent of entries) {
                const full = path.join(cur, ent.name);
                const st = fs.lstatSync(full);
                requireCond(!st.isSymbolicLink(), `Symlink is not allowed in release package: ${path.relative(dirPath, full)}`);
                if (st.isDirectory()) {
                  stack.push(full);
                } else if (st.isFile()) {
                  out.push(full);
                }
              }
            }
            return out.sort();
          }

          function stripHtmlComments(text) {
            return text.replace(/<!--[\s\S]*?-->/g, "").replace(/<!--[\s\S]*$/g, "").trim();
          }

          function readStrictReadme(pkgDir, filename) {
            const p = path.join(pkgDir, filename);
            const st = fs.lstatSync(p);
            requireCond(!st.isSymbolicLink() && st.isFile(), `${filename} must be a non-symlink regular file`);
            const raw = fs.readFileSync(p);
            requireCond(raw.length <= MAX_README_BYTES, `${filename} exceeds ${MAX_README_BYTES} bytes`);
            const text = raw.toString("utf8").replace(/^\ufeff/, "").trim();
            requireCond(Boolean(text), `${filename} must not be empty`);
            return text;
          }

          function validateWebAndScripts(pkgDir, files) {
            const pyFiles = files.filter((f) => /\.(py|pyc)$/i.test(f));
            requireCond(pyFiles.length === 0, `Python files are forbidden in JS plugin package: ${pyFiles.join(", ")}`);

            const jsFiles = files.filter((f) => /\.(js|mjs)$/i.test(f));
            requireCond(jsFiles.length > 0, "No JS files found in staged package");
            for (const jsFile of jsFiles) {
              execFileSync(process.execPath, ["--check", jsFile], { stdio: "pipe" });
            }

            const requiredWeb = ["web/index.html", "web/styles.css", "web/app.js", "web/arcana.js", "web/art.js"];
            for (const rel of requiredWeb) {
              const full = path.join(pkgDir, rel);
              requireCond(fs.existsSync(full) && fs.statSync(full).isFile(), `Missing required file: ${rel}`);
            }

            for (const pair of [["arcana.js", "web/arcana.js"], ["art.js", "web/art.js"]]) {
              const a = fs.readFileSync(path.join(pkgDir, pair[0]), "utf8");
              const b = fs.readFileSync(path.join(pkgDir, pair[1]), "utf8");
              requireCond(a === b, `${pair[1]} is out of sync with ${pair[0]}`);
            }

            const webApp = fs.readFileSync(path.join(pkgDir, "web/app.js"), "utf8");
            requireCond(webApp.includes("Escape"), "web/app.js must support Escape key to close stage");

            const auditTargets = [
              "main.js",
              "arcana.js",
              "art.js",
              "theme-skin.json",
              "manifest.json",
              ...requiredWeb,
            ];
            for (const rel of auditTargets) {
              const txt = fs.readFileSync(path.join(pkgDir, rel), "utf8");
              requireCond(!EMOJI_RE.test(txt), `${rel} must not contain emoji`);
              requireCond(!HTTP_URL_RE.test(txt), `${rel} must not load or embed http(s) URLs`);
            }
          }

          function validateThemeSkin(pkgDir) {
            const skinPath = path.join(pkgDir, "theme-skin.json");
            requireCond(fs.existsSync(skinPath) && fs.statSync(skinPath).isFile(), "Missing theme-skin.json");
            const skin = JSON.parse(fs.readFileSync(skinPath, "utf8"));
            for (const key of ["id", "fonts", "light", "dark", "surfaces", "quick_note", "ai_indicator"]) {
              requireCond(skin[key] && typeof skin[key] === "object" || (key === "id" && typeof skin[key] === "string"), `theme-skin.json missing ${key}`);
            }
            requireCond(skin.surfaces.paper && skin.surfaces.chrome, "theme-skin.json surfaces must contain paper and chrome");
            checkText(skin, "zh", "theme-skin");
            checkContributesEn(skin, "theme-skin");
            return skin;
          }

          function createMockSdkEnv(tmpDir) {
            const mockSdkPath = path.join(tmpDir, "mock-block-sdk.mjs");
            const sdkLines = [
              'import fs from "node:fs";',
              "let seq = 1000;",
              "const inboundQueue = [];",
              "const waitArr = new Int32Array(new SharedArrayBuffer(4));",
              "const byteBuf = Buffer.alloc(1);",
              "export class HostRPCError extends Error {",
              "  constructor(code, message) {",
              "    super(message);",
              '    this.name = "HostRPCError";',
              "    this.code = code;",
              "  }",
              "}",
              "export function log(...args) {",
              '  process.stderr.write(args.map((v) => (typeof v === "string" ? v : JSON.stringify(v))).join(" ") + "\\n");',
              "}",
              "export function send(obj) {",
              '  fs.writeSync(1, JSON.stringify(obj) + "\\n");',
              "}",
              "export function notifyHost(method, params = {}) {",
              '  send({ jsonrpc: "2.0", method, params: params ?? {} });',
              "}",
              "function readLineSync() {",
              "  const chunks = [];",
              "  while (true) {",
              "    let n = 0;",
              "    try {",
              "      n = fs.readSync(0, byteBuf, 0, 1, null);",
              "    } catch (err) {",
              '      if (err && (err.code === "EAGAIN" || err.code === "EINTR")) {',
              "        Atomics.wait(waitArr, 0, 0, 1);",
              "        continue;",
              "      }",
              "      throw err;",
              "    }",
              "    if (n === 0) {",
              "      if (chunks.length === 0) return null;",
              "      break;",
              "    }",
              "    const ch = byteBuf[0];",
              "    if (ch === 10) break;",
              "    if (ch !== 13) chunks.push(ch);",
              "  }",
              '  return Buffer.from(chunks).toString("utf8");',
              "}",
              "function readMessageLine() {",
              "  while (true) {",
              "    const line = readLineSync();",
              "    if (line === null) return null;",
              "    const trimmed = line.trim();",
              "    if (!trimmed) continue;",
              "    try {",
              "      const msg = JSON.parse(trimmed);",
              '      if (msg && typeof msg === "object" && !Array.isArray(msg)) return msg;',
              "    } catch {}",
              "  }",
              "}",
              "export function callHost(method, params = {}) {",
              "  seq += 1;",
              "  const reqId = `p-${seq}`;",
              '  send({ jsonrpc: "2.0", id: reqId, method, params: params ?? {} });',
              "  while (true) {",
              "    const msg = readMessageLine();",
              '    if (msg === null) throw new Error("stdin closed while awaiting host response");',
              '    const isResp = msg.id !== undefined && msg.id !== null && String(msg.id) === reqId && !msg.method && ("result" in msg || "error" in msg);',
              "    if (isResp) {",
              "      if (msg.error) {",
              '        throw new HostRPCError(typeof msg.error.code === "number" ? msg.error.code : -32000, msg.error.message || "host error");',
              "      }",
              "      return msg.result ?? {};",
              "    }",
              "    inboundQueue.push(msg);",
              "  }",
              "}",
              "function nextInboundMessage() {",
              "  if (inboundQueue.length > 0) return inboundQueue.shift();",
              "  return readMessageLine();",
              "}",
              "export function serve(handler) {",
              "  while (true) {",
              "    const req = nextInboundMessage();",
              "    if (req === null) break;",
              "    const method = req.method;",
              '    if (typeof method !== "string" || !method) continue;',
              "    const reqId = req.id;",
              '    const params = req.params && typeof req.params === "object" && !Array.isArray(req.params) ? req.params : {};',
              "    try {",
              "      const result = handler(method, params, req);",
              "      if (reqId !== undefined && reqId !== null) {",
              '        send({ jsonrpc: "2.0", id: reqId, result: result === undefined ? null : result });',
              "      }",
              '      if (method === "plugin.shutdown") break;',
              "    } catch (err) {",
              "      if (reqId !== undefined && reqId !== null) {",
              '        send({ jsonrpc: "2.0", id: reqId, error: { code: typeof err?.code === "number" ? err.code : -32000, message: err?.message ? String(err.message) : String(err) } });',
              "      }",
              '      if (method === "plugin.shutdown") break;',
              "    }",
              "  }",
              "}",
            ];
            fs.writeFileSync(mockSdkPath, sdkLines.join("\n") + "\n", "utf8");

            const loaderPath = path.join(tmpDir, "sdk-loader.mjs");
            const mockSdkUrl = pathToFileURL(mockSdkPath).href;
            fs.writeFileSync(
              loaderPath,
              [
                "export async function resolve(specifier, context, nextResolve) {",
                '  if (specifier === "/runtime/block-sdk.js") {',
                `    return { url: ${JSON.stringify(mockSdkUrl)}, shortCircuit: true };`,
                "  }",
                "  return nextResolve(specifier, context);",
                "}",
              ].join("\n") + "\n",
              "utf8"
            );

            const registerPath = path.join(tmpDir, "register-loader.mjs");
            const loaderUrl = pathToFileURL(loaderPath).href;
            fs.writeFileSync(
              registerPath,
              `import { register } from "node:module";\nregister(${JSON.stringify(loaderUrl)});\n`,
              "utf8"
            );
            return registerPath;
          }

          async function runPluginGate(pkgDir, pluginId, locale, registerPath) {
            const en = locale.toLowerCase().startsWith("en");
            const storage = {};
            let skinEnabled = false;
            let stageRoom = "table";
            let stageOpen = false;
            let activePath = "notes/plan.md";
            const notes = [
              { path: "notes/plan.md", title: en ? "Annual Writing Plan" : "年度写作计划", mod_unix: Math.floor(Date.now() / 1000) - 3600, size: 420 },
              { path: "notes/travel.md", title: en ? "Autumn Walk Notes" : "秋夜散步札记", mod_unix: Math.floor(Date.now() / 1000) - 86400 * 10, size: 680 },
              { path: "notes/future.md", title: en ? "Draft for Later" : "给未来的草稿", mod_unix: Math.floor(Date.now() / 1000) - 86400 * 3, size: 16 },
            ];
            const contents = {
              "notes/plan.md": en ? "# Annual Writing Plan\n\n> Focus on one question.\n" : "# 年度写作计划\n\n> 只围绕一个问题展开。\n",
              "notes/travel.md": en ? "# Autumn Walk\n\nQuiet dusk walk.\n" : "# 秋夜散步\n\n黄昏漫步。\n",
              "notes/future.md": "",
            };

            function handleHost(method, params) {
              switch (method) {
                case "host.storage.get":
                  return { found: Object.hasOwn(storage, params.key), value: storage[params.key] };
                case "host.storage.set":
                  storage[params.key] = params.value;
                  return { ok: true };
                case "host.titlebar.set_button":
                case "host.ui.refresh":
                case "host.ui.toast":
                case "host.stage.emit":
                case "host.ai.open_with_prompt":
                  return { ok: true };
                case "host.ui.set_theme_skin":
                  skinEnabled = Boolean(params.enabled);
                  return { ok: true, id: params.id, enabled: skinEnabled };
                case "host.stage.open":
                  stageOpen = true;
                  stageRoom = params.room;
                  return { ok: true };
                case "host.stage.close":
                  stageOpen = false;
                  return { ok: true };
                case "host.notes.list":
                  return { notes };
                case "host.notes.active":
                  return { path: activePath };
                case "host.notes.read":
                  return { path: params.path, content: contents[params.path] ?? "" };
                case "host.notes.open":
                  activePath = params.path;
                  return { ok: true, path: params.path };
                case "host.ai.status":
                  return { ready: true, enabled: true, available: true };
                case "host.ai.complete":
                  return {
                    text: en
                      ? "1. In this plan, what changed?\n2. What counterexample exists?\n3. What can be cut?"
                      : "1. 计划里哪条未验证？\n2. 有什么反例？\n3. 可以删掉什么？",
                  };
                default:
                  throw new Error(`Unexpected host RPC: ${method}`);
              }
            }

            const child = spawn(process.execPath, ["--import", registerPath, "main.js"], {
              cwd: pkgDir,
              stdio: ["pipe", "pipe", "pipe"],
            });
            let stderr = "";
            child.stderr.on("data", (d) => { stderr += d.toString(); });

            const queue = [];
            const waiters = [];
            let buf = "";
            let exited = false;
            child.stdout.on("data", (d) => {
              buf += d.toString();
              let idx;
              while ((idx = buf.indexOf("\n")) !== -1) {
                const line = buf.slice(0, idx).trim();
                buf = buf.slice(idx + 1);
                if (!line) continue;
                if (waiters.length > 0) waiters.shift()(line);
                else queue.push(line);
              }
            });
            child.on("exit", () => {
              exited = true;
              while (waiters.length > 0) waiters.shift()(null);
            });
            const nextLine = () => {
              if (queue.length > 0) return Promise.resolve(queue.shift());
              if (exited) return Promise.resolve(null);
              return new Promise((resolve) => waiters.push(resolve));
            };

            let reqId = 0;
            async function rpc(method, params = {}) {
              reqId += 1;
              const id = reqId;
              child.stdin.write(JSON.stringify({ jsonrpc: "2.0", id, method, params }) + "\n");
              while (true) {
                const line = await Promise.race([
                  nextLine(),
                  new Promise((_, reject) => setTimeout(() => reject(new Error(`${locale}: timeout on ${method}`)), 8000)),
                ]);
                requireCond(line !== null, `${locale}: plugin exited during ${method}: ${stderr}`);
                const msg = JSON.parse(line);
                requireCond(msg.jsonrpc === "2.0", `${method}: invalid jsonrpc version`);
                if (msg.method) {
                  try {
                    const result = handleHost(msg.method, msg.params || {});
                    child.stdin.write(JSON.stringify({ jsonrpc: "2.0", id: msg.id, result }) + "\n");
                  } catch (err) {
                    child.stdin.write(JSON.stringify({ jsonrpc: "2.0", id: msg.id, error: { code: -32000, message: err.message } }) + "\n");
                  }
                  continue;
                }
                requireCond(msg.id === id, `${method}: unexpected response id`);
                requireCond(!msg.error, `${method}: ${JSON.stringify(msg.error)}`);
                return msg.result;
              }
            }

            const init = await rpc("plugin.initialize", {
              plugin_id: pluginId,
              locale,
              notebook_root: "/tmp/notebook",
              ui_capabilities: ["metric_tone"],
            });
            requireCond(init && init.ready === true, `${locale}: plugin.initialize must return {ready: true}`);

            const rendered = await rpc("plugin.render", { surface: "settings_page" });
            requireCond(rendered?.page?.title, `${locale}: settings_page missing title`);
            if (en) checkText(rendered, "en", "en.plugin.render");

            const actToggle = await rpc("plugin.action", { surface: "settings_page", action_id: "toggle_skin" });
            requireCond(actToggle.ok && skinEnabled === true, `${locale}: toggle_skin failed`);
            if (en) checkText(actToggle, "en", "en.action.toggle_skin");

            const cmdToggle = await rpc("plugin.command", { command_id: "toggle_tarot" });
            requireCond(cmdToggle.ok && skinEnabled === false, `${locale}: toggle_tarot failed`);
            if (en) checkText(cmdToggle, "en", "en.command.toggle_tarot");

            const cmdTable = await rpc("plugin.command", { command_id: "open_table" });
            requireCond(cmdTable.ok && stageOpen && stageRoom === "table", `${locale}: open_table failed`);

            const stDraw = await rpc("plugin.stage_action", { action: "draw_table", payload: {} });
            requireCond(stDraw.table?.spread?.cards?.length === 3, `${locale}: draw_table failed`);
            const stFlip = await rpc("plugin.stage_action", { action: "flip_table_card", payload: { index: 0 } });
            requireCond(typeof stFlip.table?.flipped?.[0] === "boolean", `${locale}: flip_table_card failed`);
            const stAi = await rpc("plugin.stage_action", { action: "ai_read_spread", payload: {} });
            requireCond(stAi.aiUsed === true, `${locale}: ai_read_spread failed`);
            const stDaily = await rpc("plugin.stage_action", { action: "flip_daily", payload: { flipped: true } });
            requireCond(stDaily.daily?.flipped === true, `${locale}: flip_daily failed`);
            const stDoubt = await rpc("plugin.stage_action", { action: "ai_daily_doubt", payload: { open: true } });
            requireCond(stDoubt.daily?.doubtOpen === true && stDoubt.daily?.card?.doubtQuestions?.length === 3, `${locale}: ai_daily_doubt failed`);
            const stDeck = await rpc("plugin.stage_action", { action: "set_deck_filter", payload: { filter: "got" } });
            requireCond(stDeck.deck?.filter === "got", `${locale}: set_deck_filter failed`);
            const stNote = await rpc("plugin.stage_action", { action: "open_note", payload: { path: "notes/plan.md", closeStage: true } });
            requireCond(stNote.ok && !stageOpen, `${locale}: open_note failed`);
            if (en) checkText([stDraw, stAi, stDaily, stDoubt, stDeck], "en", "en.stage_action");

            await rpc("plugin.shutdown", {});
            await new Promise((r) => child.once("exit", r));
            return rendered.page;
          }

          async function validateStagedPackage(pkgDir) {
            const files = walkFiles(pkgDir);
            validateWebAndScripts(pkgDir, files);
            validateThemeSkin(pkgDir);

            const manifestPath = path.join(pkgDir, "manifest.json");
            const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
            const pluginId = String(manifest.id || "").trim();
            requireCond(pluginId && pluginId !== "block-diagnostics", `Invalid plugin id: ${pluginId}`);
            requireCond(manifest.entry && manifest.entry.js === "main.js", "manifest.entry.js must be 'main.js'");
            requireCond(!manifest.entry.command && !manifest.entry.wasm, "manifest.entry must only declare js");
            requireCond(Array.isArray(manifest.contributes?.themes) && manifest.contributes.themes.length > 0, "manifest.contributes.themes required");
            requireCond(Array.isArray(manifest.contributes?.stages) && manifest.contributes.stages.length > 0, "manifest.contributes.stages required");
            for (const perm of manifest.permissions || []) {
              const reason = manifest.permission_reasons?.[perm];
              requireCond(reason && reason.zh && reason.en, `manifest.permission_reasons[${perm}] must provide zh and en`);
              requireCond([...reason.zh].length <= 80 && [...reason.en].length <= 140, `permission_reasons[${perm}] exceeds length limit`);
            }
            for (const field of ["name", "summary"]) {
              const tr = manifest[field];
              requireCond(tr && typeof tr === "object", `manifest.${field} must be an object`);
              requireCond(typeof tr.zh === "string" && tr.zh.trim(), `Missing manifest.${field}.zh`);
              requireCond(typeof tr.en === "string" && tr.en.trim(), `Missing manifest.${field}.en`);
              requireCond(!CHINESE_RE.test(tr.en), `manifest.${field}.en contains Chinese`);
            }
            checkText(manifest, "zh", "manifest");
            checkContributesEn(manifest.contributes);

            const zhReadme = readStrictReadme(pkgDir, "README.md");
            const enReadme = readStrictReadme(pkgDir, "README.en.md");
            requireCond(HAN_RE.test(stripHtmlComments(zhReadme)), "README.md must contain visible Chinese text");
            requireCond(!CHINESE_RE.test(enReadme), "README.en.md must contain English-only text");
            requireCond(/[A-Za-z]/.test(stripHtmlComments(enReadme)), "README.en.md must contain at least one visible ASCII letter");
            checkText(zhReadme, "zh", "README.md");
            checkText(enReadme, "en", "README.en.md");
            requireCond(zhReadme !== enReadme, "The two README files must differ");

            const tmpDir = fs.mkdtempSync(path.join(os.tmpdir(), "block-tarot-gate-"));
            try {
              const registerPath = createMockSdkEnv(tmpDir);
              const zhPage = await runPluginGate(pkgDir, pluginId, "zh", registerPath);
              const enPage = await runPluginGate(pkgDir, pluginId, "en", registerPath);
              assert.notEqual(zhPage.title, enPage.title, "settings_page: Chinese and English page titles must differ");
              assert.notDeepEqual(zhPage, enPage, "settings_page: Chinese and English rendered pages must differ");
            } finally {
              fs.rmSync(tmpDir, { recursive: true, force: true });
            }
            console.log("Node bilingual release gate passed on staged dist package.");
          }

          const repo = process.env.REPO;
          const event = process.env.EVENT_NAME;
          const refName = process.env.REF_NAME;
          const force = process.env.FORCE === "true";

          const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
          requireCond(manifest.app === "blockmd", "manifest.app must be 'blockmd'");
          const pluginId = manifest.id.trim();
          requireCond(/^[a-z0-9][a-z0-9-]{1,47}$/.test(pluginId), `invalid id: ${pluginId}`);
          const baseVer = manifest.version.trim();
          const mBase = baseVer.match(/^(\d+)\.(\d+)\.(\d+)$/);
          requireCond(Boolean(mBase), `manifest.version must be X.Y.Z, got ${baseVer}`);
          const baseMajor = Number(mBase[1]);
          const baseMinor = Number(mBase[2]);
          const pluginTitle = (manifest.name?.en || pluginId).trim();

          const headSha = sh("git", ["rev-parse", "HEAD"]);

          function parseVer(tag) {
            const m = String(tag || "").trim().match(/^v?(\d+)\.(\d+)\.(\d+)$/);
            return m ? [Number(m[1]), Number(m[2]), Number(m[3])] : null;
          }

          function cmpVer(a, b) {
            for (let i = 0; i < 3; i++) {
              if (a[i] !== b[i]) return a[i] - b[i];
            }
            return 0;
          }

          function verKey(v) {
            return `${v[0]}.${v[1]}.${v[2]}`;
          }

          const rawRels = sh("gh", ["api", "--paginate", `repos/${repo}/releases?per_page=100`, "--jq", ".[]"]);
          const releases = rawRels.split(/\r?\n/).filter((l) => l.trim()).map((l) => JSON.parse(l));
          const stable = releases
            .filter((r) => !r.draft && !r.prerelease && parseVer(r.tag_name))
            .sort((a, b) => cmpVer(parseVer(a.tag_name), parseVer(b.tag_name)));
          const previous = stable.length > 0 ? stable[stable.length - 1] : null;

          const taken = new Map();
          for (const r of releases) {
            const pv = parseVer(r.tag_name);
            if (pv) taken.set(verKey(pv), pv);
          }
          for (const t of sh("git", ["tag", "--list", "v*"]).split(/\r?\n/)) {
            const pv = parseVer(t);
            if (pv) taken.set(verKey(pv), pv);
          }

          function resolveTagSha(rel) {
            if (!rel) return "";
            const tag = rel.tag_name;
            try {
              const s = sh("git", ["rev-parse", `${tag}^{commit}`], { stdio: ["ignore", "pipe", "ignore"] });
              if (/^[0-9a-f]{40}$/.test(s)) return s;
            } catch {}
            try {
              const s = sh("gh", ["api", `repos/${repo}/commits/${tag}`, "--jq", ".sha"], { stdio: ["ignore", "pipe", "ignore"] });
              if (/^[0-9a-f]{40}$/.test(s)) return s;
            } catch {}
            return "";
          }

          function isAncestor(anc, desc) {
            try {
              execFileSync("git", ["merge-base", "--is-ancestor", anc, desc], { stdio: "ignore" });
              return true;
            } catch {
              return false;
            }
          }

          let version = "";
          let tag = "";
          let prevSha = "";

          if (event === "push" && refName.startsWith("v")) {
            const pv = parseVer(refName);
            requireCond(Boolean(pv), `Tag ${refName} must match vX.Y.Z`);
            version = verKey(pv);
            tag = `v${version}`;
            const prevForNotes = [...stable].reverse().find((r) => r.tag_name !== tag) || null;
            prevSha = resolveTagSha(prevForNotes);
          } else {
            if (event === "schedule" && !force && previous?.published_at) {
              const fmtDate = (d) => new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Shanghai", year: "numeric", month: "2-digit", day: "2-digit" }).format(d);
              const today = fmtDate(new Date());
              const pubDay = fmtDate(new Date(previous.published_at));
              if (today === pubDay) {
                summary(`今日（${today}）已发布过 ${previous.tag_name}，每日定时最多自动发布一次，本次跳过。`);
                setOutput({ should_release: "no" });
                process.exit(0);
              }
            }

            prevSha = resolveTagSha(previous);
            if (prevSha && prevSha === headSha && !force) {
              summary(`当前 HEAD (${headSha.slice(0, 7)}) 与最新 Release ${previous.tag_name} 一致，跳过发版。`);
              setOutput({ should_release: "no" });
              process.exit(0);
            }

            if (prevSha && !force && isAncestor(prevSha, headSha)) {
              const changed = sh("git", ["diff", "--name-only", prevSha, headSha])
                .split(/\r?\n/)
                .filter((p) => p && !p.startsWith(".github/") && p !== ".gitignore" && p !== "LICENSE");
              if (changed.length === 0) {
                summary(`自 ${previous.tag_name} 以来仅包含 CI 或仓库元数据变更，无需发包，本次跳过。`);
                setOutput({ should_release: "no" });
                process.exit(0);
              }
              const subjects = sh("git", ["log", "--no-merges", "--format=%s", `${prevSha}..${headSha}`])
                .split(/\r?\n/)
                .filter(Boolean);
              if (subjects.length > 0 && subjects.every((s) => s.toLowerCase().includes("[skip release]"))) {
                summary("区间内提交均标记 [skip release]，本次跳过。");
                setOutput({ should_release: "no" });
                process.exit(0);
              }
            }

            const commitCount = Number(sh("git", ["rev-list", "--count", headSha]));
            let cand = [baseMajor, baseMinor, commitCount];
            const highest = [...taken.values()].sort(cmpVer).pop() || null;
            if (highest && cmpVer(cand, highest) <= 0) {
              cand = [highest[0], highest[1], highest[2] + 1];
            }
            while (taken.has(verKey(cand))) {
              cand = [cand[0], cand[1], cand[2] + 1];
            }
            version = verKey(cand);
            tag = `v${version}`;
          }

          const notesLines = [];
          if (prevSha && prevSha !== headSha && isAncestor(prevSha, headSha)) {
            const rawLog = sh("git", ["log", "--no-merges", "--reverse", "--format=%h%x00%s", `${prevSha}..${headSha}`]);
            for (const line of rawLog.split(/\r?\n/)) {
              if (!line.trim()) continue;
              const [cSha, subj] = line.split("\0", 2);
              if (/^(?:ci|docs)(?:\([^)]*\))?:\s/i.test(subj)) continue;
              notesLines.push(`- ${subj} (\`${cSha}\`)`);
            }
          }
          if (notesLines.length === 0) {
            notesLines.push(`- Automated release from \`${headSha.slice(0, 7)}\`.`);
          }
          fs.writeFileSync("release-notes.md", `## Changes\n\n${notesLines.join("\n")}\n`, "utf8");

          const pkgDir = path.join("dist", pluginId);
          fs.rmSync("dist", { recursive: true, force: true });
          fs.mkdirSync(pkgDir, { recursive: true });
          const tarBytes = execFileSync("git", ["archive", "--format=tar", headSha]);
          execFileSync("tar", ["-xf", "-", "-C", pkgDir], { input: tarBytes });
          fs.rmSync(path.join(pkgDir, ".github"), { recursive: true, force: true });
          for (const metaFile of [".gitignore"]) {
            const p = path.join(pkgDir, metaFile);
            if (fs.existsSync(p) && !fs.lstatSync(p).isSymbolicLink()) {
              fs.rmSync(p);
            }
          }

          manifest.version = version;
          fs.writeFileSync(path.join(pkgDir, "manifest.json"), JSON.stringify(manifest, null, 2) + "\n", "utf8");

          await validateStagedPackage(pkgDir);

          const archiveName = `${pluginId}-${tag}.tar.gz`;
          execFileSync("tar", ["-czf", archiveName, "-C", "dist", pluginId]);

          const listed = execFileSync("tar", ["-tzf", archiveName], { encoding: "utf8" });
          requireCond(listed.includes(`${pluginId}/web/index.html`), "Archive missing web/index.html");
          requireCond(listed.includes(`${pluginId}/theme-skin.json`), "Archive missing theme-skin.json");

          summary(`准备发布 ${pluginTitle} ${tag} (archive=${archiveName}, commit=${headSha.slice(0, 7)})`);
          setOutput({
            should_release: "yes",
            version,
            tag,
            title: `${pluginTitle} ${version}`,
            archive: archiveName,
            head_sha: headSha,
          });
          EOF

      # 更新说明只经 tailnet 用 Magpie：Mac 在线先用 Mac 的 agy-cli/gemini-3.8-flash，再 VPS gpt-6-luna，最后 deepseek-flash。
      # 与 Block 主仓 scripts/release/release-notes.mjs 的顺序保持一致；不要用 Google AI Studio key。
      - name: Join tailnet
        id: tailscale
        if: steps.plan.outputs.should_release == 'yes'
        continue-on-error: true
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci-release-notes
          version: "1.104.4"
          ping: "100.115.90.80"
          timeout: 1m
          retry: "2"
          args: --shields-up

      - name: Write release notes with AI
        if: steps.plan.outputs.should_release == 'yes'
        env:
          TAILNET: ${{ steps.tailscale.outcome }}
        run: |
          reach() { timeout "$3" bash -c "echo >/dev/tcp/$1/$2" 2>/dev/null && echo yes || echo no; }
          if [ "$TAILNET" = "success" ]; then
            export MAGPIE_REACHABLE=$(reach 100.115.90.80 3425 10)
            export MAC_MAGPIE_REACHABLE=$(reach 100.118.27.43 3425 8)
          else
            export MAGPIE_REACHABLE=no MAC_MAGPIE_REACHABLE=no
          fi
          node .github/scripts/release-notes.mjs release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        if: steps.plan.outputs.should_release == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.plan.outputs.tag }}
          TITLE: ${{ steps.plan.outputs.title }}
          ARCHIVE: ${{ steps.plan.outputs.archive }}
          HEAD_SHA: ${{ steps.plan.outputs.head_sha }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "${TITLE}" --notes-file release-notes.md --draft=false --latest
            gh release upload "${TAG}" "${ARCHIVE}" --clobber
          else
            gh release create "${TAG}" "${ARCHIVE}" \
              --target "${HEAD_SHA}" \
              --title "${TITLE}" \
              --notes-file release-notes.md \
              --latest
          fi
